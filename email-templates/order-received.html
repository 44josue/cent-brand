<!--
  Sent by: place-order / guest-place-order edge functions
  From: orders@cent.rw (no-reply)
  Tokens: {{customer_name}} {{order_code}} {{items_rows}} {{discount_row}} {{total}} {{tracking_url}}
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Order Received — CENT</title>
</head>
<body style="margin:0;padding:0;background:#0a0a0a;font-family:'Inter',Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a">
<tr><td align="center" style="padding:24px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#111111;border:1px solid #222222;border-radius:12px;overflow:hidden">

  <tr>
    <td style="background:#111111;padding:28px 32px;border-bottom:1px solid #1f1f1f;text-align:center">
      <img src="https://cent.rw/assets/images/white%20logo.png" alt="CENT" height="36" style="display:inline-block;border:0">
    </td>
  </tr>

  <tr>
    <td style="padding:32px">
      <h2 style="font-size:20px;font-weight:700;color:#f5f5f5;margin:0 0 20px">Order Received — #{{order_code}}</h2>
      <p style="color:#a3a3a3;margin:0 0 20px;font-size:14px">Hi {{customer_name}},</p>
      <p style="color:#a3a3a3;margin:0 0 24px;font-size:14px;line-height:1.6">Your order has been placed. Complete your payment to confirm it.</p>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f0f;border:1px solid #1f1f1f;border-radius:8px;padding:20px">
        <tr><td style="padding:20px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            {{items_rows}}
            <!-- each row: <tr><td style="padding:8px 0;color:#a3a3a3;font-size:14px">{{name}} ({{size}}) &times; {{qty}}</td><td style="padding:8px 0;color:#f5f5f5;font-size:14px;text-align:right">{{line_total}} RWF</td></tr> -->
            <tr><td colspan="2"><hr style="border:none;border-top:1px solid #222222;margin:12px 0"></td></tr>
            {{discount_row}}
            <!-- optional: <tr><td style="color:#22c55e;font-size:14px">Discount</td><td style="color:#22c55e;font-size:14px;text-align:right">&minus;{{discount}} RWF</td></tr> -->
            <tr><td style="font-weight:700;color:#f5f5f5;font-size:14px">Total</td><td style="font-weight:700;color:#f5f5f5;text-align:right;font-size:14px">{{total}} RWF</td></tr>
          </table>
        </td></tr>
      </table>

      <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px">
        <tr><td style="background:#f5f5f5;border-radius:6px">
          <a href="{{tracking_url}}" style="display:inline-block;color:#0a0a0a;font-weight:700;padding:12px 28px;text-decoration:none;font-size:14px">Track My Order &rarr;</a>
        </td></tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:20px 32px;border-top:1px solid #1f1f1f;text-align:center">
      <p style="color:#525252;font-size:12px;margin:0">CENT Streetwear &mdash; Kigali, Rwanda</p>
      <p style="color:#525252;font-size:12px;margin:6px 0 0"><a href="https://cent.rw" style="color:#777777;text-decoration:none">cent.rw</a></p>
    </td>
  </tr>

</table>
</td></tr>
</table>
</body>
</html>
